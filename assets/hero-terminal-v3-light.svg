<circle cx="36" cy="20.0" r="3.3" fill="#707987"/>
<circle cx="50" cy="20.0" r="3.3" fill="#a1aab7"/>
<text x="72" y="24.5" fill="#4d5664" font-size="12.5" font-weight="400">marcus@github: ~/systems</text>
<circle cx="834" cy="20.0" r="5.2" fill="#151921" class="status-halo" opacity="0.2" aria-hidden="true"/>
<circle cx="834" cy="20.0" r="2.8" fill="#151921" aria-hidden="true"/>
<text x="938" y="24.5" fill="#4d5664" font-size="11.5" font-weight="400" text-anchor="end">ES-BR · UTC-3</text>
<rect fill="url(#obsidian)" stroke="#2b323d" x="574" y="54" width="370" height="266" rx="8"/>
<rect x="575" y="55" width="368" height="264" rx="7" fill="url(#scan-grid)" aria-hidden="true"/>
