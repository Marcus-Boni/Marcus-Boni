<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">Marcus Boni profile header</title>
<desc id="desc">Mobile terminal-style profile header for Marcus Boni, software developer.</desc>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;dominant-baseline:alphabetic}
  .portrait-line{dominant-baseline:central}
  svg{shape-rendering:geometricPrecision;text-rendering:optimizeLegibility}
  @media (prefers-reduced-motion: no-preference){
    .portrait-wash{animation:ambient-glow 8s ease-in-out infinite}
    .signal-line{animation:signal-travel 9s ease-in-out infinite}
    .terminal-cursor{animation:cursor-breathe 2.6s ease-in-out infinite}
    .portrait-neutral{animation:portrait-scan 8s ease-in-out infinite}
    .portrait-highlight{animation:highlight-scan 8s ease-in-out infinite}
  }
  @keyframes ambient-glow{0%,100%{opacity:.65}50%{opacity:1}}
  @keyframes signal-travel{0%,12%,88%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(328px);opacity:.9}}
  @keyframes cursor-breathe{0%,100%{opacity:.8}50%{opacity:.22}}
  @keyframes portrait-scan{0%,18%,100%{opacity:0.92;fill:#57606a}9%{opacity:1;fill:#a65a35}}
  @keyframes highlight-scan{0%,18%,100%{opacity:0.92;fill:#a65a35}9%{opacity:1;fill:#24292f}}
</style>
<defs><radialGradient id="portrait-wash"><stop stop-color="#a65a35" stop-opacity="0.075"/><stop offset="1" stop-color="#a65a35" stop-opacity="0"/></radialGradient></defs>
<rect width="480" height="340" rx="18" fill="#f6f8fa"/>
<rect x="22" y="20" width="436" height="298" rx="13" fill="#ffffff" stroke="#d0d7de"/>
<rect x="22" y="20" width="436" height="38" rx="13" fill="#f1f4f8" stroke="#d0d7de"/>
<circle cx="42" cy="38" r="5" fill="#ff5f56"/>
