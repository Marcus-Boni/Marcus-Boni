<circle cx="76" cy="38" r="5" fill="#27c93f"/>
<rect x="286" y="68" width="156" height="166" fill="url(#portrait-wash)" class="portrait-wash"/>
<text x="244" y="44" fill="#57606a" font-size="16" text-anchor="middle">marcus@github:~</text>
<text x="42" y="88" fill="#1a7f37" font-size="16" font-weight="700">$ whoami</text>
<rect x="130" y="74" width="8" height="15" rx="1" fill="#1a7f37" opacity="0.8" class="terminal-cursor"/>
<text x="42" y="143" fill="#24292f" font-size="50" font-weight="800">Marcus</text>
<text x="42" y="196" fill="#24292f" font-size="50" font-weight="800">Boni</text>
<text x="44" y="236" fill="#a65a35" font-size="25" font-weight="700">Software developer</text>
<text x="44" y="275" fill="#57606a" font-size="22">Full-stack products.</text>
<text x="44" y="304" fill="#57606a" font-size="22">Applied AI.</text>
