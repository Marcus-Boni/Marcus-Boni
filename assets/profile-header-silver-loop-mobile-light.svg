<svg xmlns="http://www.w3.org/2000/svg" width="480" height="466" viewBox="0 0 480 466" role="img" aria-labelledby="title desc">
<title id="title">Marcus Boni</title>
<desc id="desc">Silver ASCII portrait of Marcus Boni in a terminal.</desc>
<style>
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .portrait-line{white-space:pre}
  .portrait-reflection{display:none}
  @media (prefers-reduced-motion: no-preference){
    #portrait .portrait-line{animation:assemble .58s cubic-bezier(.2,.75,.25,1) var(--row-delay) backwards}
    .portrait-reflection{display:inline}
    #reflection-band{animation:sweep 5.4s linear 2.7s infinite backwards}
    @keyframes assemble{from{opacity:.28} to{opacity:1}}
    @keyframes sweep{from{transform:translateY(0)} to{transform:translateY(461px)}}
  }
</style>
<defs>
  <clipPath id="frame"><rect x="1" y="1" width="478" height="464" rx="11"/></clipPath>
  <linearGradient id="graphite" x2="1" y2="1">
    <stop stop-color="#08090b"/>
    <stop offset="1" stop-color="#1f2329"/>
  </linearGradient>
  <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="330">
    <stop stop-color="#8d98a5"/>
    <stop offset=".42" stop-color="#f4f6f8"/>
    <stop offset=".72" stop-color="#cbd2da"/>
    <stop offset="1" stop-color="#8d98a5"/>
  </linearGradient>
  <linearGradient id="reflection-falloff" x2="0" y2="1">
    <stop stop-color="#fff" stop-opacity="0"/>
    <stop offset=".32" stop-color="#fff" stop-opacity=".36"/>
    <stop offset=".52" stop-color="#fff" stop-opacity=".95"/>
    <stop offset=".74" stop-color="#fff" stop-opacity=".30"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="reflection-mask" maskUnits="userSpaceOnUse" x="16" y="59" width="448" height="265">
    <g transform="skewY(-7) translate(0 2)">
      <rect id="reflection-band" x="16" y="-73" width="448" height="124" fill="url(#reflection-falloff)"/>
    </g>
  </mask>
</defs>
<rect x="0.5" y="0.5" width="479" height="465" rx="12" fill="#f5f6f8" stroke="#b7bdc5"/>
<rect width="480" height="48" fill="#e9ecf0" clip-path="url(#frame)"/>
<circle cx="25" cy="24" r="3.5" fill="#454d58"/>
<circle cx="39" cy="24" r="3.5" fill="#687380"/>
<circle cx="53" cy="24" r="3.5" fill="#909aa6"/>
<text x="82" y="30" fill="#4e5662" font-size="16" font-weight="400">marcus@github</text>
<rect fill="url(#graphite)" x="16" y="59" width="448" height="265" rx="8"/>
<g id="portrait" fill="url(#silver)"><g id="portrait-glyphs">
